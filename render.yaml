services:
  - type: web
    name: freskinto-api
    runtime: node
    rootDir: Freskinto-api
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run db:deploy && npm run start:prod
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: URL_PREFIX
        value: v1
      - key: DATABASE_URL
        fromDatabase:
          name: freskinto-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: "*"
        sync: false # Set to your Vercel frontend URL, e.g. https://freskinto-web.vercel.app,https://*.vercel.app
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Store Admin

databases:
  - name: freskinto-db
    databaseName: onlinemart
    user: onlinemart
    plan: free
